<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças do Casal</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#15103A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2315103A'/%3E%3Ctext x='50' y='52' text-anchor='middle' dominant-baseline='central' font-family='Segoe UI,Arial,sans-serif' font-weight='700' font-size='44' fill='%23E8C46C'%3ER$%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#EEF0F7;--bg2:#E3DFF3;--au1:rgba(124,92,255,.30);--au2:rgba(20,170,160,.24);--au3:rgba(222,168,60,.26);
  --glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.82);--stroke:rgba(24,26,60,.10);--hi:rgba(255,255,255,.9);
  --ink:#161A33;--muted:#5D6385;--gold:#A87A14;--nec:#0F8F83;--des:#C4407A;--inv:#A87A14;--via:#2F6FD0;--srv:#6B55C8;
  --alert:#CF3F36;--alertbg:rgba(207,63,54,.12);--okbg:rgba(15,143,131,.12);--shadow:rgba(40,36,100,.20);
  --btn:#161A33;--btnink:#F7F3EA;--field:rgba(255,255,255,.7);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:#080C20;--bg2:#15103A;--au1:rgba(124,92,255,.42);--au2:rgba(22,168,156,.30);--au3:rgba(231,195,106,.20);
  --glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.11);--stroke:rgba(255,255,255,.12);--hi:rgba(255,255,255,.22);
  --ink:#F4EFE4;--muted:#A6ACCB;--gold:#E8C46C;--nec:#4FD6C8;--des:#F48DBC;--inv:#E8C46C;--via:#8CBDFF;--srv:#B4A5FF;
  --alert:#FF7C6C;--alertbg:rgba(255,124,108,.14);--okbg:rgba(79,214,200,.12);--shadow:rgba(0,0,0,.55);
  --btn:#E8C46C;--btnink:#1A1430;--field:rgba(255,255,255,.07);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg1:#080C20;--bg2:#15103A;--au1:rgba(124,92,255,.42);--au2:rgba(22,168,156,.30);--au3:rgba(231,195,106,.20);
  --glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.11);--stroke:rgba(255,255,255,.12);--hi:rgba(255,255,255,.22);
  --ink:#F4EFE4;--muted:#A6ACCB;--gold:#E8C46C;--nec:#4FD6C8;--des:#F48DBC;--inv:#E8C46C;--via:#8CBDFF;--srv:#B4A5FF;
  --alert:#FF7C6C;--alertbg:rgba(255,124,108,.14);--okbg:rgba(79,214,200,.12);--shadow:rgba(0,0,0,.55);
  --btn:#E8C46C;--btnink:#1A1430;--field:rgba(255,255,255,.07);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2));background-attachment:fixed;
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(60px)}
.aurora i{position:absolute;border-radius:50%;opacity:1}
.aurora i:nth-child(1){width:55vmax;height:55vmax;left:-10%;top:-12%;background:var(--au1);animation:drift1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:45vmax;height:45vmax;right:-12%;top:18%;background:var(--au2);animation:drift2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:40vmax;height:40vmax;left:15%;bottom:-18%;background:var(--au3);animation:drift1 38s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(8vmax,6vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-7vmax,5vmax) scale(.92)}}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
main{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:14px 16px 130px}
.serif{font-family:"Fraunces",Georgia,serif;font-optical-sizing:auto}

.glass{background:var(--glass);border:1px solid var(--stroke);border-radius:24px;
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 18px 40px -22px var(--shadow),inset 0 1px 0 var(--hi)}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 2px}
.top h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.55rem;margin:0;letter-spacing:-.01em}
.nav{width:42px;height:42px;border-radius:50%;border:1px solid var(--stroke);background:var(--glass);font-size:1.25rem;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 var(--hi)}
.sync{font-size:.78rem;color:var(--muted);text-align:center;margin:0 0 6px}

/* ---- carteira 3D ---- */
.deck-wrap{perspective:1100px;height:230px;margin:6px 0 4px;display:grid;place-items:center;touch-action:pan-y}
.deck{position:relative;width:min(88vw,340px);aspect-ratio:1.586;transform-style:preserve-3d;
  transform:rotateX(calc(14deg + var(--rx,0deg))) rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.deck.float{animation:float 7s ease-in-out infinite}
@keyframes float{50%{translate:0 -6px}}
.card{position:absolute;inset:0;border-radius:18px;padding:16px 18px;border:0;text-align:left;display:flex;flex-direction:column;justify-content:space-between;
  transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.9,.2,1),filter .5s,opacity .5s;overflow:hidden;
  box-shadow:0 30px 50px -24px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 80% at calc(30% + var(--gx,0%)) calc(0% + var(--gy,0%)),rgba(255,255,255,.45),transparent 55%);mix-blend-mode:soft-light}
.card[data-pos="0"]{transform:translate3d(0,0,0);z-index:3}
.card[data-pos="1"]{transform:translate3d(0,-22px,-60px) scale(.95);z-index:2;filter:brightness(.8)}
.card[data-pos="2"]{transform:translate3d(0,-42px,-120px) scale(.9);z-index:1;filter:brightness(.62)}
.card.bradesco{background:linear-gradient(125deg,#EEF1F5 0%,#AEB6C4 38%,#F4F6F9 52%,#8B94A6 78%,#C9CFD9 100%);color:#1B2131}
.card.nubank{background:linear-gradient(130deg,#9E5BFF 0%,#6A1FD0 45%,#3A0B83 100%);color:#FBF7FF}
.card.avista{background:linear-gradient(130deg,#1FB5A3 0%,#0E7A70 50%,#073F3B 100%);color:#F1FFFC}
.card .row1{display:flex;justify-content:space-between;align-items:flex-start}
.card .bank{font-weight:800;font-size:1.02rem;letter-spacing:.01em}
.card .kind{font-size:.72rem;opacity:.75;margin-top:1px}
.chipemv{width:40px;height:30px;border-radius:7px;background:linear-gradient(135deg,#F6DE9A,#C99A3B 55%,#F2D78A);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);position:relative}
.chipemv::before{content:"";position:absolute;inset:7px 0;border-top:1px solid rgba(0,0,0,.25);border-bottom:1px solid rgba(0,0,0,.25)}
.chipemv::after{content:"";position:absolute;inset:0 13px;border-left:1px solid rgba(0,0,0,.25);border-right:1px solid rgba(0,0,0,.25)}
.card .amt{font-family:"Fraunces",Georgia,serif;font-size:2rem;font-weight:600;letter-spacing:-.01em;line-height:1}
.card .row3{display:flex;justify-content:space-between;font-size:.8rem;opacity:.85}
.deck.intro .card{animation:dealIn .9s cubic-bezier(.2,.9,.2,1) both}
.deck.intro .card[data-pos="1"]{animation-delay:.08s}.deck.intro .card[data-pos="2"]{animation-delay:.16s}
@keyframes dealIn{from{opacity:0;transform:translate3d(0,80px,-200px) rotateX(-40deg)}}
.hint{font-size:.74rem;color:var(--muted);text-align:center;margin:0 0 10px}

/* ---- número principal ---- */
.headline{text-align:center;margin:4px 0 14px}
.headline .lbl{color:var(--muted);font-size:.9rem;margin:0}
.headline .big{font-family:"Fraunces",Georgia,serif;font-size:2.9rem;font-weight:600;line-height:1.05;margin:4px 0 6px;letter-spacing:-.02em}
.pill{display:inline-block;padding:7px 14px;border-radius:999px;font-size:.88rem;font-weight:600}
.pill.bad{background:var(--alertbg);color:var(--alert)}.pill.good{background:var(--okbg);color:var(--nec)}

section.panel{padding:18px 16px;margin-bottom:14px}
section.panel h2{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:1.18rem;margin:0 0 2px}
section.panel .desc{color:var(--muted);font-size:.84rem;margin:0 0 14px}

/* ---- skyline 3D ---- */
.sky{position:relative;height:200px;margin-top:6px}
.sky .floor{position:absolute;left:4px;right:14px;bottom:26px;height:12px;background:linear-gradient(90deg,var(--glass2),transparent);
  transform:skewX(-45deg);transform-origin:bottom left;border-top:1px solid var(--stroke)}
.sky .cols{position:absolute;left:0;right:12px;bottom:26px;height:160px;display:grid;grid-template-columns:repeat(6,1fr);align-items:end}
.sky .col{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:none;border:0;padding:0}
.sky .v{font-size:.72rem;font-weight:700;color:var(--muted);margin-bottom:12px}
.prism{position:relative;width:54%;border-radius:2px 2px 0 0;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 92%,white),color-mix(in srgb,var(--c) 70%,black));
  transition:height .6s cubic-bezier(.2,.9,.2,1)}
.prism::before{content:"";position:absolute;left:0;top:-9px;width:100%;height:9px;transform-origin:bottom left;transform:skewX(-45deg);
  background:color-mix(in srgb,var(--c) 60%,white)}
.prism::after{content:"";position:absolute;right:-9px;top:0;width:9px;height:100%;transform-origin:top left;transform:skewY(-45deg);
  background:color-mix(in srgb,var(--c) 55%,black)}
.col.sel .prism{box-shadow:0 0 26px -2px var(--c)}
.col.sel .v{color:var(--ink)}
.sky .mlabels{position:absolute;left:0;right:12px;bottom:0;display:grid;grid-template-columns:repeat(6,1fr);text-align:center;font-size:.76rem;color:var(--muted)}
.sky .mlabels .on{color:var(--gold);font-weight:700}
.plane{position:absolute;left:0;right:6px;height:14px;pointer-events:none;transform:skewX(-45deg);transform-origin:bottom left;
  background:linear-gradient(90deg,color-mix(in srgb,var(--alert) 30%,transparent),color-mix(in srgb,var(--alert) 8%,transparent));
  border-bottom:1.5px solid var(--alert);box-shadow:0 0 18px -4px var(--alert)}
.plane-l{position:absolute;right:0;font-size:.7rem;color:var(--alert);font-weight:700;transform:translateY(-100%)}

/* ---- anel 3D ---- */
.ringbox{display:grid;grid-template-columns:1fr;gap:6px}
.ring-wrap{position:relative;height:150px;margin:0 0 4px;perspective:700px;display:grid;place-items:center}
.ring{position:relative;width:170px;height:170px;transform-style:preserve-3d;transform:rotateX(60deg) rotateZ(-28deg)}
.ring .ly{position:absolute;inset:0;border-radius:50%;
  -webkit-mask:radial-gradient(circle,transparent 57%,#000 58%);mask:radial-gradient(circle,transparent 57%,#000 58%)}
.ring-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;transform:translateY(-8px)}
.ring-c b{font-family:"Fraunces",Georgia,serif;font-size:1.35rem;font-weight:600;display:block}
.ring-c span{font-size:.74rem;color:var(--muted)}
.bucket{padding:12px 0;border-top:1px solid var(--stroke)}
.bucket .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bucket .nm{font-weight:700;display:flex;align-items:center;gap:8px}
.dot{width:11px;height:11px;border-radius:4px;flex:none;display:inline-block;box-shadow:0 0 10px -1px currentColor}
.track{height:8px;background:var(--glass2);border-radius:6px;margin-top:8px;overflow:hidden}
.fill{height:100%;border-radius:6px}
.bucket .sub{font-size:.8rem;color:var(--muted);margin-top:5px}
.bucket .sub.over{color:var(--alert);font-weight:600}
.muted{color:var(--muted)}.small{font-size:.82rem}
.alert{padding:12px 14px;margin-bottom:14px;border-radius:18px;background:var(--alertbg);color:var(--alert);font-size:.9rem;border:1px solid color-mix(in srgb,var(--alert) 30%,transparent)}
.pay{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--stroke);font-size:.95rem}
.pay b{font-weight:700;white-space:nowrap}

/* ---- lista ---- */
.chips{display:flex;gap:8px;overflow-x:auto;margin:6px -16px 12px;padding:0 16px 2px;scrollbar-width:none}
.chip{border:1px solid var(--stroke);background:var(--glass);border-radius:999px;padding:8px 15px;font-size:.88rem;white-space:nowrap;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chip.on{background:var(--btn);color:var(--btnink);border-color:transparent}
.group h3{font-size:.9rem;margin:0;padding:14px 0 6px;display:flex;justify-content:space-between;color:var(--muted);font-weight:700}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--stroke);padding:12px 0}
.item .t{flex:1;min-width:0}
.item .d{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.item .meta{font-size:.8rem;color:var(--muted)}
.item .val{font-weight:700;white-space:nowrap}
.tag-end{font-size:.7rem;background:var(--okbg);color:var(--nec);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:30px 8px}

/* ---- barra inferior ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1.25fr 70px 1.2fr 1fr;align-items:center;height:64px;border-radius:24px;
  background:var(--glass2);border:1px solid var(--stroke);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  box-shadow:0 20px 40px -18px var(--shadow),inset 0 1px 0 var(--hi)}
.tab{background:none;border:0;font-size:.74rem;padding:0 2px;color:var(--muted);height:100%;font-weight:700}
.tab.on{color:var(--ink)}
.fab{width:50px;height:50px;border-radius:50%;border:0;justify-self:center;transform:none;font-size:1.7rem;line-height:1;color:#2A1B05;
  background:radial-gradient(circle at 35% 30%,#FFF1C4,#E8C46C 45%,#A7771A 100%);
  box-shadow:0 14px 26px -8px rgba(168,120,20,.7),inset 0 -4px 8px rgba(0,0,0,.25),inset 0 3px 6px rgba(255,255,255,.6)}
.fab:active{transform:scale(.94)}

/* ---- formulários ---- */
.field{margin-bottom:14px}
.field label,.flabel{display:block;font-size:.84rem;color:var(--muted);margin-bottom:6px;font-weight:700}
.field input{width:100%;padding:13px;border-radius:14px;border:1px solid var(--stroke);background:var(--field);font-size:1rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:1px solid var(--stroke);background:var(--field);border-radius:12px;padding:10px;font-size:.9rem;font-weight:600}
.seg button.on{background:var(--btn);color:var(--btnink);border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.pjctrl{align-items:end}
.four{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.btn{width:100%;padding:15px;border-radius:16px;border:0;background:var(--btn);color:var(--btnink);font-weight:800;font-size:1rem;
  box-shadow:0 12px 24px -12px var(--shadow)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--stroke);margin-top:8px;box-shadow:none}
.btn.danger{background:transparent;color:var(--alert);border:1px solid var(--alert);margin-top:8px;box-shadow:none}
.preview{border-radius:14px;padding:12px;font-size:.88rem;margin-bottom:14px;background:var(--okbg);color:var(--ink)}
.preview.bad{background:var(--alertbg);color:var(--alert)}
.preview p{margin:0 0 4px}.preview p:last-child{margin:0}
.overlay{position:fixed;inset:0;background:rgba(6,8,22,.5);z-index:30;display:none;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.overlay.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:92%;overflow-y:auto;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;
  background:linear-gradient(180deg,var(--bg2),var(--bg1));border-top:1px solid var(--stroke);
  box-shadow:0 -20px 50px -20px var(--shadow);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.2,1)}
.sheet.open{transform:none}
.sheet .in{max-width:580px;margin:0 auto}
.sheet h2{font-family:"Fraunces",Georgia,serif;font-weight:600;margin:0 0 14px;font-size:1.4rem}
.grab{width:42px;height:5px;border-radius:3px;background:var(--stroke);margin:0 auto 12px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--btn);color:var(--btnink);padding:10px 16px;border-radius:14px;font-size:.9rem;font-weight:600;z-index:40;display:none}

.pay>span:last-child{display:flex;align-items:center;gap:6px;white-space:nowrap}
.mini{border:1px solid var(--stroke);background:var(--field);border-radius:999px;padding:4px 12px;font-size:.78rem;font-weight:700;margin-right:6px}
.mini.gold{background:var(--btn);color:var(--btnink);border-color:transparent}
.tgrid{display:grid;gap:8px;margin-bottom:6px}
.tcell{border:1px solid var(--stroke);background:var(--field);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;gap:2px;align-items:center;min-width:0}
.tcell span{font-size:.72rem;color:var(--muted);font-weight:600;white-space:nowrap}.tcell b{font-size:.86rem}
.tcell.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.tcell.ult{border-color:color-mix(in srgb,var(--nec) 50%,transparent);background:var(--okbg)}.tcell.ult b{color:var(--nec)}
.pay.big{font-size:1rem}
.card.ultima{background:linear-gradient(130deg,#F6E7B0 0%,#D9A93A 45%,#8F6410 100%);color:#2A1B05}
.card.c3{background:linear-gradient(130deg,#FF8A5B,#C2410C 55%,#6B1F05);color:#FFF6F1}
.card.c4{background:linear-gradient(130deg,#1FB5A3,#0E7A70 50%,#073F3B);color:#F1FFFC}
.card.c5{background:linear-gradient(130deg,#60A5FA,#1D4ED8 55%,#0B2470);color:#F3F7FF}
.spark{font-size:1.4rem;opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin:2px 0 8px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.today{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;margin-bottom:14px}
.today .lbl{display:block;font-size:.82rem;color:var(--muted);font-weight:600}
.today b{font-family:"Fraunces",Georgia,serif;font-size:1.7rem;font-weight:600;line-height:1.1}
.cmp{display:block;margin-top:2px;font-weight:700;color:var(--muted)}.cmp.up{color:var(--alert)}.cmp.down{color:var(--nec)}
.subs{margin-top:8px;display:grid;gap:6px}
.subrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.82rem;color:var(--muted)}
.subrow small{font-size:.74rem}.subrow .over{color:var(--alert);font-weight:700}
.track.split{display:flex}.track.split .fill{border-radius:0}.track.split .fill:first-child{border-radius:6px 0 0 6px}.track.split .fill:last-child{border-radius:0 6px 6px 0}
.sub.fxsplit{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.sub.fxsplit .sq{width:9px;height:9px;border-radius:3px;display:inline-block}
.track.thin{grid-column:1/-1;height:4px;margin-top:2px}
.evol{width:100%;height:130px;display:block}
.search{margin:8px 0 2px}
.search input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--stroke);background:var(--field);font-size:1rem}
.sim{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.simb{border:1px solid var(--stroke);background:var(--field);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:1px}
.simb b{font-size:.9rem}.simb span{font-size:.7rem}.simb small{font-size:.66rem;color:var(--muted)}
.simb.over small{color:var(--alert);font-weight:700}.simb.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:12px;vertical-align:middle;margin-right:8px;border:1px solid var(--stroke)}
.file{width:100%;font-size:.9rem;color:var(--muted)}
.tag-end.foto{background:var(--glass2);color:var(--muted)}
.tag-end.off{background:var(--alertbg);color:var(--alert)}
.lv-sw{max-width:460px;margin:0 0 16px}
.lock{max-width:440px;margin:12vh auto 0}.lock h1{font-family:"Fraunces",Georgia,serif;font-weight:600;margin:0 0 6px}.lock form{margin:16px 0 8px}.lock .btn+.btn{margin-top:8px}
.item.fx-off{opacity:.6}
.item .fx-nota{display:block;color:var(--gold);font-weight:600}
button.pay.fx-link{width:100%;background:none;border:0;border-top:1px solid var(--stroke);color:inherit;font:inherit;text-align:left;cursor:pointer}
button.pay.fx-link b{color:var(--nec)}
.fx-pay{display:flex;align-items:center;gap:12px;border-top:1px solid var(--stroke);padding:12px 0}
.fx-ck{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px solid color-mix(in srgb,var(--muted) 55%,transparent);background:var(--field);display:grid;place-items:center;cursor:pointer;padding:0;transition:background .15s,border-color .15s}
.fx-ck.on{background:var(--nec);border-color:var(--nec)}
.fx-ck.on::after{content:"";width:11px;height:6px;border:3px solid #fff;border-top:0;border-right:0;transform:translateY(-2px) rotate(-45deg)}
.fx-info{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.fx-info .d{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-info .meta{font-size:.8rem;color:var(--muted)}
.fx-pay.ok .d{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.fx-v{white-space:nowrap}
.st{align-self:flex-start;font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 7px;margin-top:2px}
.st.ok{background:var(--okbg);color:var(--nec)}.st.pend{background:var(--glass2);color:var(--muted)}.st.late{background:var(--alertbg);color:var(--alert)}
.sit-panel{margin:0 0 20px}
.sit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.sit-b{border:1px solid var(--stroke);background:var(--field);border-radius:18px;padding:14px 16px}
.sit-b[role=button]{cursor:pointer}.sit-b[role=button]:hover{border-color:var(--gold)}
.sit-b h3{margin:0 0 4px;font-size:1rem}
.sit-b .pay{padding:8px 0}
.sit-n{margin:8px 0 0}
@media (max-width:820px){.sit{grid-template-columns:1fr}}
.alert.warn{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold);border-color:color-mix(in srgb,var(--gold) 35%,transparent)}
.cardcfg{border-top:1px solid var(--stroke);padding-top:12px;margin-top:4px}
body.full .tabbar,body.travado .tabbar{display:none}
body.travado main{margin-left:auto!important;margin-right:auto!important;max-width:520px!important;padding-left:16px;padding-right:16px}
.fs{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}
.fs h1{font-weight:600;font-size:1.6rem;margin:0}
#undo{background:none;border:1px solid var(--btnink);color:inherit;border-radius:999px;padding:3px 10px;margin-left:8px;font-weight:700}
.vault-wrap{perspective:800px;height:170px;display:grid;place-items:center;margin-top:4px}
.vault{position:relative;width:140px;height:140px;transform-style:preserve-3d;transform:rotateX(62deg) rotateZ(-20deg);animation:coinspin 18s linear infinite}
.vault i{position:absolute;inset:0;border-radius:50%;transform:translateZ(calc(var(--i) * 9px));
  background:radial-gradient(circle at 40% 35%,#FFF4CC,#E8C46C 42%,#B5851E 75%,#8A6212);
  box-shadow:inset 0 0 0 6px rgba(120,84,14,.55),inset 0 0 0 10px rgba(255,236,170,.35)}
.vault i:last-child::after{content:"R$";position:absolute;inset:0;display:grid;place-items:center;font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:2.4rem;color:rgba(110,76,10,.55)}
@keyframes coinspin{to{transform:rotateX(62deg) rotateZ(340deg)}}
.stats{display:flex;justify-content:center;gap:10px;margin-top:10px}
.stats>div{background:var(--glass);border:1px solid var(--stroke);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;align-items:center;min-width:130px}
.stats span{font-size:.76rem;color:var(--muted);font-weight:600}.stats b{font-size:1.02rem}.stats small{font-size:.74rem;color:var(--muted)}
.stats.big3{margin:0 0 14px}.stats.big3>div{min-width:0;flex:1;padding:10px 6px}
.pos{color:var(--nec)}.neg{color:var(--alert)}
.item .val small{display:block;text-align:right;font-size:.74rem;font-weight:700}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.three .btn{padding:12px 4px;font-size:.86rem;margin:0}
.metab{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--stroke);color:inherit}
.check{display:flex;gap:10px;align-items:center;font-size:.9rem;margin:0 0 12px}.check input{width:20px;height:20px;accent-color:var(--gold)}
.four .btn{margin:0}
.subrow+.subrow{margin-top:8px}
.ptabs{margin-top:4px}
.big2{font-family:"Fraunces",Georgia,serif;font-size:2rem;font-weight:600;margin:0 0 4px;color:var(--gold)}
.sug{border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.tl{position:relative;padding:8px 0 8px 22px;display:flex;flex-direction:column;border-left:2px solid var(--stroke);margin-left:6px}
.tl i{position:absolute;left:-7px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.tl b{font-size:.92rem}
.tlr{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.tlr span{white-space:nowrap;font-weight:700;font-size:.9rem}
.tl.k-compra i{background:var(--via);box-shadow:0 0 8px var(--via)}.tl.k-venda i{background:var(--alert);box-shadow:0 0 8px var(--alert)}
.tl.k-provento i{background:var(--nec);box-shadow:0 0 8px var(--nec)}.tl.k-saldo i{background:var(--muted);box-shadow:none}
.tly{margin:14px 0 4px}
.pay.sub2{padding-left:14px;font-size:.88rem;color:var(--muted)}
.pbars{height:160px}.pbars .cols{height:120px}.pbars .mlabels span{font-size:.66rem;line-height:1.1}
.pbars .prism{width:60%}.tlcard{cursor:pointer}
.prio{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--glass2);font-size:.72rem;color:var(--gold)}
.rowb{width:100%;background:none;border:0;border-top:1px solid var(--stroke);color:inherit;text-align:left}
.city .prism{width:62%}
.rk{display:flex;align-items:center;gap:10px;padding:10px 0}.rk .t{flex:1;display:flex;flex-direction:column;min-width:0}
.linkb{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px;font-size:inherit}
.filebtn{display:block;text-align:center;cursor:pointer}
.pdfrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--stroke)}
.pdfrow input{width:20px;height:20px;accent-color:var(--gold);flex:none}.pdfrow .t{flex:1;min-width:0}
.pdfrow .d{display:block;font-weight:700}.pdfrow .meta{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.vault{animation:none}}

/* ---- projeção e independência ---- */
.pjctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:0 10px}
.pjsky .mlabels{font-size:.64rem}
.pjctrl input{padding:10px 12px}
.pjstats{margin:4px 0 8px}
:root{--pj1:#4F74C8;--pj2:#B07F12;--pj3:#0F8F83}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pj1:#5F83D8;--pj2:#B38A28;--pj3:#1F9E90}}
:root[data-theme="dark"]{--pj1:#5F83D8;--pj2:#B38A28;--pj3:#1F9E90}
.pjleg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted);margin:14px 0 6px}
.pjleg i,.pjtip i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pjc{position:relative;height:230px;margin:26px 0 0 58px}
.pjg{position:absolute;left:0;right:0;border-top:1px dashed var(--stroke);height:0}
.pjg:first-child{border-top:1px solid color-mix(in srgb,var(--muted) 45%,transparent)}
.pjg span{position:absolute;right:calc(100% + 8px);top:-.62em;font-size:.7rem;color:var(--muted);white-space:nowrap}
.pjcols{position:absolute;inset:0;display:grid;align-items:end;gap:0}
.pjcol{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;outline:none;cursor:default}
.pjcol::before{content:"";position:absolute;inset:0 1px;border-radius:6px;background:transparent;transition:background .12s}
.pjcol:hover::before,.pjcol:focus::before{background:color-mix(in srgb,var(--muted) 12%,transparent)}
/* colunas 3D: cada segmento tem face lateral própria; o segmento de cima ganha a tampa */
.pjbar{--d:9px;position:relative;width:52%;max-width:30px;min-height:3px;display:flex;flex-direction:column;margin-right:var(--d)}
.pjbar i{position:relative;display:block;min-height:2px;background-image:linear-gradient(90deg,rgba(255,255,255,.18),rgba(255,255,255,0) 45%,rgba(0,0,0,.12))}
.pjbar i+i{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35)}
.pjbar i::after{content:"";position:absolute;top:0;right:calc(-1 * var(--d));width:var(--d);height:100%;transform-origin:top left;transform:skewY(-45deg);
  background:inherit;background-image:linear-gradient(rgba(0,0,0,.34),rgba(0,0,0,.34))}
.pjbar i:first-child::before{content:"";position:absolute;left:0;top:calc(-1 * var(--d));width:100%;height:var(--d);transform-origin:bottom left;transform:skewX(-45deg);
  background:inherit;background-image:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,.38))}
.pjcol::after{content:"";position:absolute;bottom:-5px;left:50%;width:70%;max-width:44px;height:8px;transform:translateX(-45%);border-radius:50%;
  background:radial-gradient(closest-side,var(--shadow),transparent);pointer-events:none}
.pjcol.ini .pjbar{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--gold) 75%,transparent))}
.pjcol:hover .pjbar,.pjcol:focus .pjbar{filter:brightness(1.08) drop-shadow(0 6px 10px var(--shadow))}
.pjend{position:absolute;right:0;transform:translateY(-6px);font-size:.76rem;font-weight:800;white-space:nowrap;color:var(--ink)}
.pjtip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:5;min-width:230px;padding:10px 12px;border-radius:12px;
  background:var(--glass2);border:1px solid var(--stroke);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 14px 30px -12px var(--shadow);font-size:.78rem;pointer-events:none}
.pjtip{bottom:auto;top:0;left:calc(100% + 6px);transform:none;background:color-mix(in srgb,var(--bg1) 94%,transparent)}
.pjtip.r{left:auto;right:calc(100% + 6px)}
.pjcol:hover .pjtip,.pjcol:focus .pjtip{display:grid;gap:4px}
.pjtip{min-width:260px}
.pjtip>b{font-size:.84rem}
.pjtip span{display:flex;align-items:center;gap:0;color:var(--muted);white-space:nowrap}
.pjtip span strong{margin-left:auto;padding-left:12px;color:var(--ink)}
.pjtip .tt em{font-style:normal;color:var(--ink);font-weight:700}
.pjtip .mu{font-size:.72rem;border-top:1px solid var(--stroke);padding-top:5px;margin-top:2px}
.pjx{display:grid;margin:6px 0 0 58px;font-size:.72rem;color:var(--muted);text-align:center;white-space:nowrap}
.pjx span.on{color:var(--gold);font-weight:700}
.pjtab{font-size:.88rem}
.pjh,.pjr{display:grid;grid-template-columns:1fr 1.2fr 1fr 1.2fr;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--stroke)}
.pjtab.comdiv .pjh,.pjtab.comdiv .pjr{grid-template-columns:.8fr 1.15fr .95fr 1fr 1.15fr}
.pjr .gold{color:var(--gold);font-weight:700}
.pjstats.four4{flex-wrap:wrap}.pjstats.four4>div{flex:1 1 30%}
.pjstats .divbox{flex-basis:100%!important;background:color-mix(in srgb,var(--gold) 12%,var(--glass));border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.pjstats .divbox b{color:var(--gold)!important}
.pjtip .divl{border-top:1px solid var(--stroke);padding-top:5px;margin-top:2px;color:var(--ink);font-weight:700}
.pjtip .divl strong{color:var(--gold)}
.pjtip .divs{font-size:.72rem;justify-content:flex-end}
.pjtip .divs b{color:var(--nec);margin-left:3px}
.pjtip .altl{color:var(--muted);font-weight:700}
.pjtip .altl i{background:none!important;border-top:2px dashed var(--ink);height:0!important;width:12px!important;border-radius:0!important}
.pjalt{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:2}
.pjalt polyline{stroke:var(--ink);stroke-width:2;stroke-dasharray:5 4;opacity:.75}
.pjalt circle{stroke:var(--ink);stroke-width:6;stroke-linecap:round;opacity:.75}
.pjleg i.dash{background:none!important;border-top:2px dashed var(--ink);height:0!important;width:16px!important;border-radius:0!important;vertical-align:3px}
/* resumo dos dividendos: comparação lado a lado */
.pjstats .divbox{padding:12px 14px;gap:8px;align-items:stretch}
.divbox .dvh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.8rem;font-weight:700;color:var(--ink)}
.divbox .dvh em{font-style:normal;font-weight:600;color:var(--muted);font-size:.74rem}
.dvcmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.dvcmp>div{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 10px;border-radius:12px;border:1px solid var(--stroke);background:var(--glass);opacity:.72}
.dvcmp>div.on{opacity:1;border-color:var(--gold);background:var(--glass2);box-shadow:0 0 0 1px var(--gold)}
.dvcmp small{font-size:.72rem;color:var(--muted);font-weight:700}
.pjstats .divbox .dvcmp b{font-size:1.15rem;color:var(--muted)!important}.pjstats .divbox .dvcmp>div.on b{color:var(--gold)!important}
.dvcmp i{font-style:normal;font-size:.72rem;color:var(--muted)}
.dvgain{align-self:center;padding:4px 12px;border-radius:999px;background:var(--okbg);color:var(--nec);font-size:.78rem;font-weight:800}
/* detalhe da coluna: cabeçalho com saldo e comparação em grade */
.pjtip .tth{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:4px;margin-bottom:2px;border-bottom:1px solid var(--stroke)}
.pjtip .tth b{font-size:.84rem;color:var(--ink)}.pjtip .tth strong{font-size:.95rem}
.ttcmp{display:grid;grid-template-columns:auto 1fr 1fr;gap:3px 10px;align-items:baseline;border-top:1px solid var(--stroke);padding-top:6px;margin-top:3px;font-size:.74rem}
.ttcmp span{color:var(--muted);white-space:nowrap}
.ttcmp em{font-style:normal;font-size:.68rem;font-weight:800;color:var(--muted);text-align:right}
.ttcmp b{text-align:right;color:var(--muted);font-weight:700;white-space:nowrap}
.ttcmp .on{color:var(--gold)}.ttcmp b.on{color:var(--ink);font-weight:800}
.cmpdiv{display:block;font-style:normal;font-size:.76rem;color:var(--muted);margin-top:6px;line-height:1.4}.cmpdiv b{color:var(--nec)}
.pjh{color:var(--muted);font-size:.76rem;font-weight:700;border-top:0}
.pjr>*:nth-child(n+3),.pjh>*:nth-child(n+3){text-align:right}
.pjr.ini>span:first-child{color:var(--gold);font-weight:700}
.pjin{width:100%;padding:6px 8px;border-radius:10px;border:1px solid var(--stroke);background:var(--field);text-align:right;font-size:.86rem}
.pjin.over{border-color:var(--gold);color:var(--gold);font-weight:700}
.ifres b{font-size:1.02rem}
/* investido por mês */
.invsvg{width:100%;height:auto;display:block;overflow:visible;margin-top:4px}.invsvg text{font-family:"Figtree",sans-serif}
.invcol{cursor:pointer;outline:none;transition:filter .12s}.invcol:hover,.invcol:focus-visible{filter:brightness(1.1)}
.invcol.on{filter:brightness(1.12) drop-shadow(0 4px 6px var(--shadow))}
.invstats{margin:0 0 6px}
.invdet{margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--glass2);border:1px solid var(--stroke)}
.invdet-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:.84rem}.invdet-h span{color:var(--muted);font-size:.78rem}
/* faturas do mês: status com sinal verde quando quitada */
.fat-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.fat-cnt{font-family:"Figtree",sans-serif;font-size:.74rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--glass2);border:1px solid var(--stroke);color:var(--muted)}
.fat-cnt.all{background:var(--okbg);border-color:color-mix(in srgb,var(--nec) 35%,transparent);color:var(--nec)}
.fatrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:11px 12px;margin-top:8px;border-radius:14px;border:1px solid var(--stroke);background:var(--glass);position:relative;overflow:hidden}
.fatrow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--stroke)}
.fat-t{display:flex;flex-direction:column;gap:2px;min-width:0}.fat-t b{font-size:.95rem}
.fat-sub{font-size:.76rem;color:var(--muted)}
.fat-a{display:flex;align-items:center;gap:8px;white-space:nowrap}.fat-a .mini{margin:0}.fat-a b{font-size:1rem}
.fatrow.paga{background:var(--okbg);border-color:color-mix(in srgb,var(--nec) 35%,transparent)}
.fatrow.paga::before{background:var(--nec)}
.fat-ic{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--nec);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--nec) 18%,transparent)}
.fat-badge{align-self:flex-start;font-size:.72rem;font-weight:800;color:var(--nec);background:color-mix(in srgb,var(--nec) 14%,transparent);padding:2px 8px;border-radius:999px}
.fatrow.paga .fat-a b{color:var(--nec)}
.fatrow.parcial{background:color-mix(in srgb,var(--gold) 12%,transparent);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.fatrow.parcial::before,.fatrow.parcial .fat-ic{background:var(--gold)}.fatrow.parcial .fat-badge{color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.fat-dot{width:12px;height:12px;border-radius:50%;margin:0 8px;background:var(--muted);opacity:.6}
.fatrow.soon::before,.fatrow.soon .fat-dot{background:var(--gold);opacity:1}.fatrow.soon .fat-sub{color:var(--gold);font-weight:700}
.fatrow.late::before,.fatrow.late .fat-dot{background:var(--alert);opacity:1}.fatrow.late .fat-sub{color:var(--alert);font-weight:700}
.fatrow.late .fat-dot{box-shadow:0 0 0 4px color-mix(in srgb,var(--alert) 18%,transparent);animation:fatpulse 1.6s ease-in-out infinite}
@keyframes fatpulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--alert) 6%,transparent)}}
.mini.comp{border-color:color-mix(in srgb,var(--nec) 45%,transparent);color:var(--nec)}
.compbox{display:flex;gap:12px;align-items:center;padding:10px;margin:0 0 14px;border-radius:14px;background:var(--glass2);border:1px solid var(--stroke)}
.compbox img{width:84px;height:84px;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--stroke);flex:none}
.compbox div{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0;font-size:.82rem}
.compbox b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.compbox .ok{color:var(--nec);font-weight:800}.compbox .warn{color:var(--gold);font-weight:700}
.compfull{width:100%;border-radius:12px;border:1px solid var(--stroke);background:#fff;margin-bottom:8px}
@media (prefers-reduced-motion:reduce){.fatrow.late .fat-dot{animation:none}}
/* calculadora de cotas */
.cq{display:grid;gap:12px;margin-top:12px;container-type:inline-size}
.cq-blk{padding:14px;border-radius:18px;background:var(--glass);border:1px solid var(--stroke);display:flex;flex-direction:column;gap:10px}

/* ---------- versão online (GitHub Pages): os dados de partida vêm em dados.enc.json, cifrados (PBKDF2-SHA256 + AES-256-GCM, gerado pelo Cifrar-Dados.js) ---------- */

function telaSenha(pk,opt){opt=opt||{};S.travado=true;document.body.classList.add("travado");window.scrollTo(0,0);

  const r=RV(a.tipo)?0:taxaEf(a);let v=0,apl=0,qtd=0,qc=0,last=null,lastSnap=null,est=false,prov=0,preco=0,first=null,upd=null;

function simular(aporte){const c=carteira(todayStr()),desp=despesaMedia();const r=Math.pow(1+taxaCarteira(c)/100,1/12)-1;
  const alvos=[];if(desp)alvos.push({nome:"Reserva de emergência",valor:desp*(S.cfg.mesesReserva||6),saldo:c.reserva});
  for(const mt of metasOrdenadas())alvos.push({nome:mt.nome,valor:mt.valor,saldo:metaProgress(mt),prazo:mt.prazo});
  for(let i=1;i<=600&&alvos.some(a=>a.mes===undefined);i++){let resto=aporte;for(const a of alvos){a.saldo=a.saldo*(1+r);if(a.mes!==undefined)continue;if(a.saldo>=a.valor){a.mes=i-1;continue}const put=Math.min(resto,a.valor-a.saldo);a.saldo+=put;resto-=put;if(a.saldo>=a.valor)a.mes=i;if(resto<=0)break}}
  return alvos}

    else if(m.tipo==="saldo")ev.push({d:m.data,k:"saldo",t:`${rv?"Cotação":"Saldo"} de ${a.nome} atualizado${rv&&m.preco?` para ${brl(m.preco)}`:""}`,v:m.valor})}
  const marcos=[100000,500000,1000000,2500000,5000000,10000000,25000000,50000000,100000000];const desp=despesaMedia(),metaRes=desp*(S.cfg.mesesReserva||6);
  let mk=movs[0].data.slice(0,7);const cur=mkey(new Date());let mi=0,res=false;const metaOk=new Set();

  return ev.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:(a.k==="marco")-(b.k==="marco"))}

/* simulador de aporte único: quanto um valor aplicado hoje paga de provento e quanto acumula */
function simAporte(){const P=projCfg(),s=P.sim,c=carteira(todayStr()),base=(S.cfg.ifPlan||{}).base||"ult",ats=rendaAtivos(base);
  const x=ats.find(a=>a.a.id===s.ativo)||(ats.length===1?ats[0]:null),valor=s.valor;let Y,nome,cotas=0,preco=0,div=0,prov=true;
  if(x){Y=x.y;nome=x.a.nome;if(x.cotas&&x.preco>0){preco=x.preco;div=x.div;cotas=Math.floor(valor/preco)}}
  else if(ats.length){const sp=ats.reduce((t,a)=>t+a.saldo,0);Y=sp?ats.reduce((t,a)=>t+a.rendaMes,0)/sp:0;nome=ats.length===1?ats[0].a.nome:"Carteira atual, na mesma proporção"}
  else{Y=Math.pow(1+projTaxa(c)/100,1/12)-1;nome="Carteira atual";prov=false}

  const prazos=[6,12,24,60].map(n=>{let v=investido,rec=0;for(let i=0;i<n;i++){const r=v*Y;rec+=r;v+=r}return {n,simples:renda*n,v:Math.round(v),rec:Math.round(rec),rendaFim:Math.round(v*Y)}});
  const pl=planoIF(c),um=ats.length===1&&ats[0].cotas?ats[0]:x&&x.cotas?x:null;
  return {s,ats,x,Y,nome,cotas,preco,div,investido,sobra,renda,prazos,prov,rendaAtual:pl.rendaAtual,metaRenda:pl.renda,um}}
function simHTML(){const r=simAporte(),s=r.s,cur=mkey(new Date());

  const nova=r.rendaAtual+r.renda,tk=r.um?esc(r.um.a.nome.split(" (")[0]):"";
  return `<div class="simbox"><h3 class="serif">Simulador de aporte</h3><p class="desc" style="margin:0 0 12px">Quanto um valor aplicado de uma vez paga por mês e quanto acumula.</p>
  <div class="pjctrl"><div class="field"><label for="sv_valor">Se eu aplicar (R$)</label><input id="sv_valor" inputmode="decimal" value="${money(s.valor)}"></div>

  ${!(s.valor>0)?`<div class="simempty"><b>Digite um valor para simular</b><span>Por exemplo, 10.000,00. O resultado mostra quantas cotas o valor compra e quanto passa a render por mês.</span></div>`
  :r.preco>0&&!r.cotas?`<div class="simempty"><b>Ainda não compra uma cota</b><span>Uma cota de ${esc(r.nome.split(" (")[0])} custa ${brl(r.preco)}. Faltam ${brl(r.preco-s.valor)} para a primeira.</span></div>`
  :`<div class="simres">
    <div class="simhero"><span>${r.prov?"Você passa a receber":"Rendimento estimado"}</span><b>${brl(r.renda)}<em>/mês</em></b><small>${brl(r.renda*12)} por ano</small></div>
    <div class="simkv">
      ${r.cotas?`<div><span>Cotas de ${esc(r.nome.split(" (")[0])}<small>a ${brl(r.preco)}${r.sobra>0?` · sobra ${brl(r.sobra)}`:""}</small></span><b>${r.cotas.toLocaleString("pt-BR")}</b></div>
      <div><span>Provento por cota<small>yield de ${pct2(r.Y*100)} ao mês</small></span><b>R$ ${(r.div/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:3})}</b></div>`
      :`<div><span>${esc(r.nome)}<small>${r.prov?"pelos proventos atuais":"pela rentabilidade estimada"}</small></span><b>${pct2(r.Y*100)} ao mês</b></div>`}
      ${r.prov?`<div><span>Renda passiva total<small>${r.metaRenda?`${pct2(nova/r.metaRenda*100)} da meta de independência`:`hoje ${brl(r.rendaAtual)}`}</small></span><b><span class="muted">${brl(r.rendaAtual)} →</span> <em class="pos">${brl(nova)}</em></b></div>`:""}

/* gráfico da projeção: colunas empilhadas (já investido + aportes + rendimento), eixo em reais, detalhe no hover */
function niceMax(v){if(v<=0)return 100;const raw=v/4,p=Math.pow(10,Math.floor(Math.log10(raw)));const s=[1,2,2.5,5,10].find(k=>k*p>=raw)*p;return s*4}
function rK(c){const r=c/100;if(r>=1e6)return "R$ "+(r/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mi";if(r>=1000)return "R$ "+(r/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil";return "R$ "+Math.round(r)}
function projChart(pts,ini,P,temDiv,reinv){
  const step=Math.max(1,Math.ceil(pts.length/24)),show=pts.filter((_,i)=>(pts.length-1-i)%step===0),n=show.length;
  const top=niceMax(Math.max(...show.map(p=>Math.max(p.saldo,temDiv&&p.alt?p.alt.saldo:0)))),lblEvery=Math.max(1,Math.ceil(n/(DESK()?8:6)));

  const grid=[0,1,2,3,4].map(i=>`<div class="pjg" style="bottom:${i*25}%"><span>${rK(top*i/4)}</span></div>`).join("");
  const cols=show.map((p,i)=>{const seg=[["pj1",ini,"Já investido"],["pj2",p.apT,"Aportes"],["pj3",p.rdT,"Rendimento"]];const edge=i>=n/2?" r":"";

      <div class="pjbar" style="height:${p.saldo/top*100}%">${seg.filter(s=>s[1]>0).reverse().map(s=>`<i style="flex:${s[1]};background-color:var(--${s[0]})"></i>`).join("")}</div>
      ${i===n-1?`<span class="pjend" style="bottom:${p.saldo/top*100}%">${brl(p.saldo)}</span>`:""}
      <div class="pjtip${edge}"><span class="tth"><b>${mLong(p.m)}</b><strong>${brl(p.saldo)}</strong></span>
        <span><i style="background:var(--pj2)"></i>Aportes<strong>${brl(p.apT)}</strong></span>
        <span><i style="background:var(--pj3)"></i>${temDiv?(reinv?"Dividendos reinvestidos":"Valorização"):"Rendimento"}<strong>${brl(p.rdT)}</strong></span>
        ${ini?`<span><i style="background:var(--pj1)"></i>Já investido<strong>${brl(ini)}</strong></span>`:""}
        ${temDiv?(()=>{const re=reinv?p:p.alt,sa=reinv?p.alt:p;return `<div class="ttcmp"><span></span><em class="${reinv?"on":""}">Reinvestindo</em><em class="${reinv?"":"on"}">Sacando</em>
          <span>Dividendos/mês</span><b class="${reinv?"on":""}">${brl(re.div)}</b><b class="${reinv?"":"on"}">${brl(sa.div)}</b>
          <span>Saldo</span><b class="${reinv?"on":""}">${brlK(re.saldo)}</b><b class="${reinv?"":"on"}">${brlK(sa.saldo)}</b></div>`})():""}</div></div>`}).join("");
  const xl=show.map((p,i)=>`<span class="${p.m===P.inicio?"on":""}">${(n-1-i)%lblEvery===0?mShort(p.m):""}</span>`).join("");
  return `<div class="pjleg"><span><i style="background:var(--pj1)"></i>Já investido</span><span><i style="background:var(--pj2)"></i>Aportes</span><span><i style="background:var(--pj3)"></i>${temDiv?(reinv?"Dividendos reinvestidos":"Valorização"):"Rendimento"}</span>${temDiv?`<span><i class="dash"></i>${reinv?"Sacando":"Reinvestindo"}</span>`:""}</div>
  <div class="pjc">${grid}${altLine}<div class="pjcols" style="grid-template-columns:repeat(${n},1fr)">${cols}</div></div>

  <p class="muted small" style="margin:6px 0 0">${DESK()?"Passe o mouse":"Toque"} numa coluna para ver o detalhe do mês. Em dourado, o mês do primeiro aporte.</p>`}
/* ---------- calculadora de cotas: quanto recebo + número mágico (3 modos, teclado na tela, metas salvas, bola de neve) ---------- */
function cqCfg(){const c=S.cfg.cq||{};return {ativo:c.ativo||"",metas:Array.isArray(c.metas)?c.metas:[1,5,10],modo:c.modo||"mes",v:c.v!=null?String(c.v):"1",qtd:c.qtd!=null?c.qtd:null,sel:c.sel!=null?c.sel:null}}
function setCq(o,salvar){S.cfg.cq=Object.assign({},S.cfg.cq||{},o);if(salvar){if(S.db)S.db.doc("config/app").set(S.cfg).catch(()=>{});else lsSet(LS.cfg,S.cfg)}}

/* cotas mês a mês: aporte do plano (a partir do mês do primeiro aporte) + dividendos reinvestidos, comprando só cotas inteiras */
function cqSim(x,meses){const P=projCfg(),cur=mkey(new Date()),o=[x.qtd];let q=x.qtd,cx=0;

function cqTotal(x,modo,v){const n=cqNum(v);return modo==="mes"?Math.ceil(n*x.preco/x.div):modo==="tot"?Math.round(n):Math.ceil(n*100/x.div)}
function cqHTML(){const {ats,x}=cqAtivo();if(!x)return "";const C=cqCfg(),cur=mkey(new Date()),tk=esc(x.a.nome.split(" (")[0]),meta=planoIF(carteira(todayStr())).renda;
  const q=C.qtd!=null?C.qtd:x.qtd,rm=Math.round(q*x.div),pm=meta?Math.min(100,rm/meta*100):0;

  const xl=[0,.25,.5,.75,1].map(f=>Math.round(end*f)).map(k=>`<text x="${X(k).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${mShort(addM(cur,k))}</text>`).join("");

    <text x="${L-6}" y="${Y(mx)+3}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(mx).toLocaleString("pt-BR")}</text><text x="${L-6}" y="${Y(0)+3}" text-anchor="end" font-size="10" fill="var(--muted)">0</text></svg>`;
  return `<div class="cq">

    <div class="cq-meter"><div><b style="width:${pm}%"></b></div><span>${pctf(pm)} da meta de renda</span><span>${brl(meta)}/mês</span></div></div>
  <div class="cq-blk"><h3><i>2</i>Número mágico</h3><p class="muted small" style="margin:0 0 10px">Quantas cotas ter para o dividendo do mês comprar cotas novas sozinho.</p>

function parseNota(t){
  if(!/Data Preg|Nota de corretagem|Notas? de negocia/i.test(t))return null;
  const di=t.search(/Data Preg/i);const data=isoBR(di>=0?t.slice(di,di+200):t)||isoBR(t);
  const nm=t.slice(Math.max(0,t.search(/N[úu]mero da nota/i))).slice(0,220).replace(/\d{5}-\d{3}/g," ").match(/(?:^|\s)(\d{5,10})(?=\s|$)/m);const nota=nm?nm[1]:"";
  const ops=[];const re=/(?:BOVESPA|B3 RV[^\s]*|1-BOVESPA)\s+(C|V)\s+(?:VISTA|FRACION[AÁ]RIO)\s+([A-Z]{4}\d{1,2})F?\b([^\n]*?)\s(\d+(?:\.\d{3})*)\s+R?\$?\s*(\d+(?:\.\d{3})*,\d{2})\s+R?\$?\s*(\d+(?:\.\d{3})*,\d{2})\s+(D|C)/g;let m;
  while((m=re.exec(t)))ops.push({cv:m[1],ticker:m[2],ctx:m[3],qtd:numBR(m[4]),preco:numBR(m[5]),valor:numBR(m[6])});
  if(!ops.length)return null;

function parsePosicao(txt){
  const out=[];const banco=bancoDe(txt);const dm=txt.match(/(?:Custódia|Posição|Posicao|Data)[^0-9]{0,20}(\d{2}\/\d{2}\/\d{4})/i);const data=dm?isoBR(dm[1]):todayStr();

      ${fix?`<div class="track split"><div class="fill" style="width:${pf}%;background:${cF}"></div><div class="fill fv" style="width:${Math.max(0,(ov?100:p)-pf)}%;background:${cV}"></div></div>`
        :`<div class="track"><div class="fill" style="width:${p}%;background:${ov?"var(--alert)":`linear-gradient(90deg,color-mix(in srgb,var(--${c}) 60%,transparent),var(--${c}))`}"></div></div>`}

  const term=d.terminam.length?d.terminam.map(it=>`<div class="pay"><span>${esc(it.desc)} <span class="muted small">${formaNome(it.forma)}, ${it.parcelas}/${it.parcelas}</span></span><b>${brl(val(it))}</b></div>`).join("")
    :`<p class="muted small" style="margin:0">Nenhuma parcela termina neste mês.</p>`;
  const prox=monthData(addM(S.sel,1)),diff=d.cartao-prox.cartao;
  const cards=S.order.map((f,i)=>({f,i})).sort((a,b)=>b.i-a.i).map(({f,i})=>cardHTML(f,d,i)).join("");
  /* faturas: paga = selo verde (com "comprovada" se tem comprovante); em aberto = ponto âmbar perto do vencimento, vermelho se venceu */

      <span class="fat-a">${v?`<button class="mini gold" data-pay="${f}">Paguei</button>`:""}<b>${brl(v)}</b></span></div>`}).join("");

  /* por pessoa e acerto */
  const pes=cfg.pessoas,rd=cfg.rendas||[cfg.renda,0],rt=rd[0]+rd[1];
  const gasto=[0,0];for(const x of d.lista){if(x.it.quem===pes[0])gasto[0]+=x.v;else if(x.it.quem===pes[1])gasto[1]+=x.v;else{gasto[0]+=Math.round(x.v/2);gasto[1]+=x.v-Math.round(x.v/2)}}
  let justa="";const ac=S.acertos[S.sel];
  if(rt>0&&rd[0]>0&&rd[1]>0){const cota0=Math.round(d.total*rd[0]/rt);const dif=gasto[0]-cota0;
    const frase=dif>0?`${esc(pes[1])} transfere ${brl(dif)} para ${esc(pes[0])}`:dif<0?`${esc(pes[0])} transfere ${brl(-dif)} para ${esc(pes[1])}`:"O mês está equilibrado";
    justa=`<div class="pay"><span>Cota justa <span class="muted small">proporcional à renda</span></span><b>${Math.round(rd[0]/rt*100)}% e ${100-Math.round(rd[0]/rt*100)}%</b></div>
    <div class="pay"><span>${ac?`Acertado em ${fmtD(ac.data)}: ${esc(ac.de)} pagou ${brl(ac.valor)} a ${esc(ac.para)}`:frase}</span>
    <span>${ac?`<button class="mini" data-unacerto="1">desfazer</button>`:(dif?`<button class="mini gold" data-acerto="${dif}">Acertei</button>`:"")}</span></div>`}
  else justa=`<p class="muted small" style="margin:10px 0 0">Informe a renda de cada um em Ajustes para ver a divisão proporcional.</p>`;
  const pessoa=`<div class="pay"><span>${esc(pes[0])}</span><b>${brl(gasto[0])}</b></div><div class="pay"><span>${esc(pes[1])}</span><b>${brl(gasto[1])}</b></div>${justa}`;
  const hojeS=todayStr(),cart=carteira(hojeS),desp=despesaMedia(),cob=desp?cart.reserva/desp:0,seqN=sequencia(mkey(new Date()));
  const patri=`<div class="pay"><span>Patrimônio investido</span><b>${brl(cart.saldo)}</b></div>

    <div class="pay"><span>Reserva de emergência</span><b>${cob.toLocaleString("pt-BR",{maximumFractionDigits:1})} de ${cfg.mesesReserva||6} meses</b></div>

  /* ranking */

const msArr=v=>Array.isArray(v)?v:(v&&v!=="todos"?[v]:[]);
function lancamentos(){
  if(S.lancVista==="fixas")return monthNav()+lancVistaSw()+fixasHTML();
  const d=monthData(S.sel),q=S.busca.trim().toLowerCase();
  for(const k of ["filtro","fcat","fquem"])S[k]=msArr(S[k]);
  const f=S.filtro,cartSel=f.filter(k=>k!=="ultima"),soUlt=f.includes("ultima");
  const grupos=[
    {attr:"filtro",nome:"Pagamento",plural:"filtros",todos:"Todos",cur:f,opts:cardIds().map(k=>[k,S.cfg.cartoes[k].nome]).concat([["avista","Boleto, Pix ou débito"],["ultima","Última parcela"]])},
    {attr:"fcat",nome:"Categoria",plural:"categorias",todos:"Todas",cur:S.fcat,opts:Object.keys(CATS).map(k=>[k,CATS[k].nome,`var(--${k})`])},
    {attr:"fquem",nome:"Quem",plural:"pessoas",todos:"Todos",cur:S.fquem,opts:[[S.cfg.pessoas[0],S.cfg.pessoas[0]],[S.cfg.pessoas[1],S.cfg.pessoas[1]],["Casal","Casal"]]}];
  const dot=c=>c?`<i class="dd-dot" style="background:${c}"></i>`:"";
  const drops=`<div class="dd-row">${grupos.map(g=>{const sel=g.opts.filter(o=>g.cur.includes(o[0])),set=sel.length>0;
    const label=!set?esc(g.todos):`${sel.slice(0,3).map(o=>dot(o[2])).join("")}<span class="dd-l">${sel.length===1?esc(sel[0][1]):sel.length+" "+g.plural}</span>`;
    return `<div class="dd${S.ddOpen===g.attr?" open":""}"><button class="dd-btn${set?" set":""}" data-dd="${g.attr}" aria-haspopup="listbox" aria-expanded="${S.ddOpen===g.attr}"><small>${g.nome}${set?` · ${sel.length}`:""}</small><b>${label}</b></button>
      <div class="dd-menu" role="listbox" aria-multiselectable="true">
        <button class="dd-all${set?"":" on"}" data-msall="${g.attr}" role="option" aria-selected="${!set}"><i class="dd-ck"></i>${esc(g.todos)}</button>
        ${g.opts.map(o=>{const on=g.cur.includes(o[0]);return `<button class="${on?"on":""}" data-ms="${g.attr}" data-v="${esc(o[0])}" role="option" aria-selected="${on}"><i class="dd-ck"></i>${dot(o[2])}${esc(o[1])}</button>`}).join("")}
        ${set?`<div class="dd-foot"><button data-msall="${g.attr}">Limpar</button><button data-ddclose="1">Pronto</button></div>`:""}</div></div>`}).join("")}</div>`;
  const ativos=grupos.flatMap(g=>g.opts.filter(o=>g.cur.includes(o[0])).map(o=>`<span class="dd-tag">${dot(o[2])}${esc(o[1])}<button data-ms="${g.attr}" data-v="${esc(o[0])}" aria-label="Remover filtro ${esc(o[1])}">×</button></span>`));
  const tags=`<div class="dd-tags">${ativos.join("")}${ativos.length>1?`<button class="dd-clear" data-act="ddLimpar">limpar tudo</button>`:""}</div>`;
  const formas=cartSel.length?cartSel:cardIds().concat(["reserva","avista"]);let html="";
  const pass=x=>!ehFixa(x.it)&&(!soUlt||(x.it.tipo==="parcelado"&&x.k===x.it.parcelas))&&(!S.fcat.length||S.fcat.includes(x.it.cat))&&(!S.fquem.length||S.fquem.includes(x.it.quem||""))&&(!q||x.it.desc.toLowerCase().includes(q));
  for(const fo of formas){
    const l=d.lista.filter(x=>x.it.forma===fo&&pass(x)).sort((a,b)=>b.v-a.v);if(!l.length)continue;

    html+=`<div class="group"><h3><span>${formaNome(fo)}</span><span>${brl(tot)}</span></h3>`+l.map(({it,k,v})=>{
      const tipo=it.tipo==="fixo"?PERN[it.per||1]+" fixo":it.tipo==="avulso"?"Única":`Parcela ${k}/${it.parcelas}`;

      <span class="meta">${tipo}, ${CATS[it.cat].nome.toLowerCase()}${it.sub&&subNome(it.cat,it.sub)?" ("+subNome(it.cat,it.sub).toLowerCase()+")":""}, ${esc(it.quem||"")}${it.usd?`, ${usdf(it.usd)} × ${rate(S.cfg.dolar)}${it.iof?" + IOF":""}`:""}</span></span>
      <span class="val">${brl(v)}</span></button>`}).join("")+`</div>`;
  }
  if(!html)html=`<div class="empty">${q||f.length||S.fcat.length||S.fquem.length?"Nada encontrado com esses filtros.":`Nada lançado em ${mLong(S.sel)}.<br>Toque no botão dourado para adicionar uma compra.`}</div>`;
  const lim=limiteValor(),ult=d.terminam.reduce((s,it)=>s+val(it),0);
  const cells=cardIds().map(k=>`<button class="tcell${f.includes(k)?" on":""}" data-ms="filtro" data-v="${k}"><span>${esc(S.cfg.cartoes[k].nome)}</span><b>${brl(d.porForma[k]||0)}</b></button>`).join("")+
    `<button class="tcell ult${soUlt?" on":""}" data-ms="filtro" data-v="ultima"><span>Última parcela</span><b>${brl(ult)}</b></button>`;
  const tot=`<section class="panel glass totals"><h2>Total de ${mLong(S.sel)}</h2>
    <div class="tgrid" style="grid-template-columns:repeat(${cardIds().length+1},1fr)">${cells}</div>
    <div class="pay big"><span>Cartões <span class="muted small">${pctf(d.pct)} da renda, limite ${brl(lim)}</span></span><b style="color:${d.cartao>lim?"var(--alert)":"var(--nec)"}">${brl(d.cartao)}</b></div>
    ${(()=>{const av=d.lista.filter(x=>!compromete(x.it)&&!ehFixa(x.it)&&x.it.cat!=="inv").reduce((s,x)=>s+x.v,0);return av?`<div class="pay"><span>Compras à vista <span class="muted small">boleto, Pix ou débito</span></span><b>${brl(av)}</b></div>`:""})()}
    <button class="pay fx-link" data-lv="fixas"><span>🏠 Despesas fixas do mês <span class="muted small">área própria</span></span><b>${brl(fixasMes(S.sel).reduce((s,x)=>s+x.v,0))} ›</b></button></section>`;
  return monthNav()+lancVistaSw()+`<div class="lgrid"><aside>`+tot+`<div class="search"><input id="busca" placeholder="Buscar lançamento${DESK()?"  ( / )":""}" value="${esc(S.busca)}" aria-label="Buscar"></div>

  <section class="panel glass" id="lista" style="padding-top:4px">${html}</section></div>`;

/* ---------- despesas fixas: lançamentos tipo "fixo" pagos FORA do cartão (boleto, Pix, débito...). Recorrência no cartão é
   compra do cartão e fica na fatura. Reajuste e reativação após pausa viram um novo trecho (origem = trecho anterior).
   O pagamento de cada mês fica em S.pagFix["AAAA-MM_<id do trecho>"] = {mes,item,valor,pagoEm} ---------- */
const PERN={1:"Mensal",2:"Bimestral",3:"Trimestral",6:"Semestral",12:"Anual"};
const MEIOS={boleto:"Boleto",pix:"Pix",debito:"Débito automático",transf:"Transferência",dinheiro:"Dinheiro"};
const ehFixa=it=>it.tipo==="fixo"&&!compromete(it);
const fixaAtiva=it=>!it.mesFim||it.mesFim>mkey(new Date());
const fixaMensal=it=>Math.round(val(it)/(it.per||1));

async function saveFixaFlow(){readFixa();const f=F,v=parseMoney(f.valor);if(!(v>0))return toast("Informe o valor");
  const cur=mkey(new Date()),per=parseInt(f.per)||1,dia=parseInt(f.dia);
  const comum={desc:f.desc||"Despesa fixa",cat:f.cat,sub:SUBC[f.cat]?(SUBC[f.cat][f.sub]?f.sub:"outros"):undefined,quem:f.quem};
  const vaiFixa=!f.cartao||f.forma==="avista";
  const prox={forma:vaiFixa?"avista":f.forma,meio:vaiFixa?f.meio:undefined,per:per>1?per:undefined,dia:dia>=1&&dia<=31?dia:undefined};
  const comValor=o=>{if(f.moeda==="usd"){o.usd=v;if(o.iof===undefined)o.iof=true}else{delete o.usd;delete o.iof;o.valor=v}o.valor=val(o);return o};
  closeSheet();
  if(!f.id){const o=comValor(Object.assign({tipo:"fixo",parcelas:1,parcelaAtual:1,mes:f.inicio||cur,criado:new Date().toISOString()},comum,prox));
    o.mesFim=f.status==="inativa"?cur:(f.mesFim&&f.mesFim>=o.mes?f.mesFim:undefined);

  const o=f.orig;

  if(f.status==="inativa"){const n=Object.assign({},o,comum,prox);if(v!==(o.usd||o.valor))comValor(n);
    n.mesFim=o.mesFim&&o.mesFim<cur?o.mesFim:cur;if(await putItem(o.id,n))toast(`Inativa a partir de ${mShort(addM(cur,1))}`);return}
  const mudou=v!==(o.usd||o.valor)||per!==(o.per||1)||(f.cartao&&f.forma!==o.forma);
  const pausa=o.mesFim&&o.mesFim<addM(cur,-1);
  const corte=pausa?(f.desde&&f.desde>cur?f.desde:cur):(mudou&&f.desde&&f.desde>o.mes?f.desde:null);
  const fim=f.mesFim||undefined;
  if(!corte){const n=comValor(Object.assign({},o,comum,prox));n.mesFim=fim&&fim>=n.mes?fim:undefined;if(await putItem(o.id,n))toast("Despesa fixa atualizada");return}

app.addEventListener("pointermove",e=>{
  if(reduce)return;const deck=document.getElementById("deck");if(!deck)return;
  const w=e.target.closest(".deck-wrap");
  if(!w){deck.style.setProperty("--rx","0deg");deck.style.setProperty("--ry","0deg");return}
  const r=w.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  deck.style.setProperty("--ry",(x*22).toFixed(1)+"deg");deck.style.setProperty("--rx",(-y*16).toFixed(1)+"deg");

});

function draftItem(){
  const v=parseMoney(F.valor);if(!(v>0))return null;
  const extra={sub:SUBC[F.cat]?(SUBC[F.cat][F.sub]?F.sub:"outros"):undefined,metaId:(F.cat==="inv"||F.cat==="via")&&F.metaId?F.metaId:undefined,mesFim:F.tipo==="fixo"&&F.mesFim?F.mesFim:undefined};
  if(F.mode==="edit"){const o=Object.assign({},F.orig,{desc:F.desc,cat:F.cat,quem:F.quem},extra);if(o.usd)o.usd=v;else o.valor=v;o.valor=val(o);if(F.foto!==undefined)o.foto=F.foto||undefined;return o}
  const n=F.tipo==="parcelado"?Math.max(2,parseInt(F.parcelas)||2):1;const pv=F.tipo==="parcelado"?Math.round(v/n):v;
  const base={desc:F.desc||"Sem descrição",forma:F.forma,tipo:F.tipo,parcelas:n,parcelaAtual:1,mes:firstPayMonth(F.forma,F.data),cat:F.cat,quem:F.quem,criado:new Date().toISOString(),foto:F.foto||undefined};
  if(F.moeda==="usd"){const o={usd:pv,iof:true};o.valor=val(o);return Object.assign(o,base,extra)}
  return Object.assign({valor:pv},base,extra);
}
function simRow(it,others){const lim=limiteValor();let worst=0,wm="";const span=it.tipo==="parcelado"?it.parcelas:it.tipo==="fixo"?6:1;
  for(let i=0;i<span;i++){const m=addM(it.mes,i);if(!occ(it,m))continue;const d=monthData(m,others.concat([it]));if(d.pct>worst){worst=d.pct;wm=m}}return {worst,wm,over:worst>S.cfg.limite}}
function preview(){
  const it=draftItem();if(!it)return `<div class="preview">Informe o valor para ver o impacto nos próximos meses.</div>`;
  const others=Object.values(S.items).filter(x=>!F.id||x.id!==F.id);const lim=limiteValor();const lines=[];let bad=false;
  if(F.mode==="new"){
    if(it.tipo==="parcelado")lines.push(`${it.parcelas}x de ${brl(it.valor)}, de ${mShort(it.mes)} a ${mShort(addM(it.mes,it.parcelas-1))}.`);
    else if(it.tipo==="fixo")lines.push(`${brl(it.valor)} todo mês a partir de ${mShort(it.mes)}${it.mesFim?" até "+mShort(it.mesFim):""}.`);
    else lines.push(`Entra em ${mShort(it.mes)}.`);}
  if(compromete(it)){
    const span=it.tipo==="parcelado"?it.parcelas:it.tipo==="fixo"?6:1;const start=F.mode==="edit"?S.sel:it.mes;const ov=[];
    for(let i=0;i<span;i++){const m=addM(start,i);if(!occ(it,m))continue;const d=monthData(m,others.concat([it]));if(d.cartao>lim)ov.push(mShort(m)+" "+pctf(d.pct))}
    if(ov.length){bad=true;lines.push(`Com essa compra, passam do limite de ${S.cfg.limite}%: ${ov.join(", ")}.`)}
    else lines.push(`Os cartões continuam dentro do limite de ${S.cfg.limite}%.`);}
  const m0=F.mode==="edit"?S.sel:it.mes;const dm=monthData(m0,others.concat([it]));const meta=Math.round(S.cfg.renda*S.cfg.pct[it.cat]/100);
  if((it.cat==="nec"||it.cat==="des")&&dm.porCat[it.cat]>meta){bad=true;lines.push(`${CATS[it.cat].nome} em ${mShort(m0)} passa da meta: ${brl(dm.porCat[it.cat])} de ${brl(meta)}.`)}
  let sim="";
  if(F.mode==="new"&&S.cfg.cartoes[F.forma]&&(F.tipo==="parcelado"||F.tipo==="avulso")){const tot=parseMoney(F.valor);
    sim=`<div class="sim">`+[1,3,6,10,12].map(n=>{const t=Object.assign({},it,{tipo:n===1?"avulso":"parcelado",parcelas:n,valor:Math.round(tot/n),usd:it.usd?Math.round(parseMoney(F.valor)/n):undefined});if(t.usd)t.valor=val(t);
      const r=simRow(t,others);return `<button type="button" class="simb${r.over?" over":""}${(F.tipo==="parcelado"?parseInt(F.parcelas):1)===n?" on":""}" data-sim="${n}"><b>${n}x</b><span>${brl(t.valor)}</span><small>pico ${Math.round(r.worst)}%</small></button>`}).join("")+`</div><p class="muted small" style="margin:6px 0 0">Simulação: toque para escolher o parcelamento. Pico é o mês mais comprometido.</p>`}
  return `<div class="preview${bad?" bad":""}">${lines.map(l=>`<p>${l}</p>`).join("")}</div>${sim}`;
}

function openPay(f){const d=monthData(S.sel);F={mode:"pay",forma:f,fatura:d.porForma[f]||0,valor:money(d.porForma[f]||0),data:todayStr(),comp:null};drawPay();openSheet()}
function drawPay(){const f=F.forma,pv=parseMoney(F.valor)||0,c=F.comp;
  const conf=c&&c.valor?(c.valor>=F.fatura?`<span class="ok">✓ Valor confere com a fatura</span>`:`<span class="warn">Pagamento parcial: faltaram ${brl(F.fatura-c.valor)}</span>`):c?`<span class="warn">Não achei o valor no comprovante. Confira à mão.</span>`:"";
  sheetIn.innerHTML=`<div class="grab"></div><h2>Pagar ${esc(S.cfg.cartoes[f].nome)}</h2><p class="muted small" style="margin:-6px 0 14px">Fatura de ${mLong(S.sel)}: ${brl(F.fatura)}</p>
  ${c?`<div class="compbox"><img src="${c.thumb}" alt="Comprovante"><div><b>${esc(c.nome)}</b>${conf}<button type="button" class="mini" data-act="compDel">trocar</button></div></div>`
    :dropZone("payAnexo","Anexar o comprovante do pagamento","PDF ou foto. O app lê o valor e a data, confere com a fatura e guarda o comprovante.")}
  <div class="field"><label for="pVal">Valor pago (R$)</label><input id="pVal" inputmode="decimal" value="${esc(F.valor)}"></div>
  <div class="field"><label for="pData">Data do pagamento</label><input id="pData" type="date" value="${F.data}"></div>
  <button class="btn" data-act="savePay">Registrar pagamento</button><button class="btn ghost" data-act="close">Cancelar</button>`}
/* miniatura leve (JPEG até 900 px) da foto ou da 1ª página do PDF */
async function miniatura(file){let canvas;
  if(ehPdf(file)){const lib=await loadPdfJs();const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;const pg=await doc.getPage(1),vp0=pg.getViewport({scale:1}),sc=Math.min(2,900/vp0.width),vp=pg.getViewport({scale:sc});
    canvas=document.createElement("canvas");canvas.width=vp.width;canvas.height=vp.height;const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);await pg.render({canvasContext:ctx,viewport:vp}).promise}
  else{const url=URL.createObjectURL(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const sc=Math.min(1,900/img.width);
    canvas=document.createElement("canvas");canvas.width=Math.round(img.width*sc);canvas.height=Math.round(img.height*sc);const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url)}
  return canvas.toDataURL("image/jpeg",.62)}
async function lerComprovantePag(file){if(!file||!F||F.mode!=="pay")return;const g=id=>document.getElementById(id);if(g("pVal"))F.valor=g("pVal").value;if(g("pData"))F.data=g("pData").value||F.data;
  let pages,thumb;try{pages=await paginasDoArquivo(file);thumb=await miniatura(file)}catch(e){erroLeitura(e);return}
  const r=lerRecibo(pages.join("\n"));if(!F||F.mode!=="pay")return;
  if(r.valor)F.valor=money(r.valor);if(r.data)F.data=r.data;
  F.comp={nome:file.name,thumb,valor:r.valor||0,data:r.data||""};drawPay();toast(r.valor?"Comprovante lido. Confira e registre.":"Comprovante anexado. Confira o valor.")}

function readCfg(){
  const g=id=>document.getElementById(id).value;
  const r0=parseMoney(g("r0"))||0,r1=parseMoney(g("r1"))||0,renda=r0+r1;const lim=parseInt(g("aLim"));
  const dolar=Math.round(parseFloat(String(g("aDol")).replace(/\./g,"").replace(",","."))*10000),iofC=parseFloat(String(g("aIof")).replace(",","."));
  const mesesReserva=Math.min(24,Math.max(1,parseInt(g("mRes"))||6));
  const nf=v=>parseFloat(String(v).replace(",","."));const cdi=nf(g("aCdi")),taxaRV=nf(g("aRv")),taxaIF=nf(g("aIf")),ipca=nf(g("aIpca"));
  const alvo={};let sa=0;for(const k of Object.keys(TIPOS)){alvo[k]=parseInt(g("al_"+k))||0;sa+=alvo[k]}
  if(sa&&sa!==100)return toast(`A carteira ideal soma ${sa}%. Ajuste para 100%.`);
  if(!(dolar>0))return toast("Informe a cotação do dólar");
  const pct={};let soma=0;for(const k of CATS_ORC){pct[k]=parseInt(g("p_"+k))||0;soma+=pct[k]}
  const subMetas={};for(const k of Object.keys(SUBS))subMetas[k]=SUB_SEM_META.includes(k)?0:(parseMoney(g("sm_"+k))||0);
  if(!(renda>0))return toast("Informe a renda mensal");
  if(!(lim>0&&lim<=100))return toast("O limite precisa ficar entre 1% e 100%");
  if(soma!==100)return toast(`A divisão soma ${soma}%. Ajuste para 100%.`);
  const cartoes=clone(S.cfg.cartoes);
  for(const k of cardIds()){cartoes[k].nome=g("cn_"+k).trim()||cartoes[k].nome;cartoes[k].limite=parseMoney(g("cl_"+k))||0;cartoes[k].fecha=Math.min(31,Math.max(1,parseInt(g("f_"+k))||cartoes[k].fecha));cartoes[k].vence=Math.min(31,Math.max(1,parseInt(g("v_"+k))||cartoes[k].vence))}
  S.cfg=Object.assign({},S.cfg,{renda,rendas:[r0,r1],dolar,iofCambio:isNaN(iofC)?0:iofC,mesesReserva,cdi:isNaN(cdi)?S.cfg.cdi:cdi,taxaRV:isNaN(taxaRV)?S.cfg.taxaRV:taxaRV,taxaIF:isNaN(taxaIF)?S.cfg.taxaIF:taxaIF,ipca:isNaN(ipca)?S.cfg.ipca:ipca,alvo,limite:lim,pct,subMetas,pessoas:[g("n0").trim()||"Pessoa 1",g("n1").trim()||"Pessoa 2"],cartoes});
  saveCfg();
}
async function exportCSV(){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){}
  if(!dl){toast("Exportação indisponível nesta tela");return}
  const first=firstMonth();const rows=[["Mês","Pagamento","Descrição","Categoria","Subcategoria","Quem","Tipo","Parcela","Valor (R$)"]];
  for(let i=0;i<24;i++){const m=addM(first,i);const d=monthData(m);if(!d.lista.length)continue;
    for(const {it,k,v} of d.lista)rows.push([m,formaNome(it.forma),it.desc,CATS[it.cat].nome,subNome(it.cat,it.sub),it.quem||"",it.tipo==="fixo"?"Mensal fixo":it.tipo==="avulso"?"Única":"Parcelada",k?`${k}/${it.parcelas}`:"",(v/100).toFixed(2).replace(".",",")])}
  rows.push([]);rows.push(["Mês","Cartão","Pago em","Valor pago (R$)"]);
  for(const [id,p] of Object.entries(S.pag)){const [m,f]=id.split("_");rows.push([m,formaNome(f),p.data,(p.valor/100).toFixed(2).replace(".",",")])}
  const ano=S.sel.slice(0,4);
  for(const y of [String(+ano-1),ano]){const dd=y+"-12-31";const c=carteira(dd);if(!c.list.some(x=>x.saldo>0||x.aplicado>0))continue;
    rows.push([]);rows.push([`Bens e direitos em 31/12/${y} (valor de custo)`+(dd>todayStr()?" - posição atual":""),"Banco","Tipo","Quantidade","Custo (R$)","Saldo de mercado (R$)"]);
    for(const x of c.list)if(x.saldo>0||x.aplicado>0)rows.push([x.a.nome,x.a.banco||"",TIPOS[x.a.tipo],x.qtd?String(x.qtd).replace(".",","):"",(x.aplicado/100).toFixed(2).replace(".",","),(x.saldo/100).toFixed(2).replace(".",",")])}
  {const ini=ano+"-01-01",fim=ano+"-12-31";const isent=[],excl=[];
    for(const a of Object.values(S.ativos)){const pv=proventosPeriodo(ini,fim,a.id);if(pv>0)(a.tipo==="fii"||a.isento?isent:excl).push([a.nome,a.tipo==="fii"?"Rendimentos de FII (isentos)":a.isento?"Rendimento isento":"Dividendos/JCP",(pv/100).toFixed(2).replace(".",",")])}
    if(isent.length||excl.length){rows.push([]);rows.push([`Rendimentos recebidos em ${ano}`,"Natureza","Valor (R$)"]);for(const r of isent.concat(excl))rows.push(r)}
    const vendas=Object.values(S.movs).filter(mv=>mv.tipo==="resgate"&&mv.qtd&&mv.data>=ini&&mv.data<=fim);
    if(vendas.length){rows.push([]);rows.push([`Vendas em renda variável em ${ano} (apuração mensal do IR é do investidor)`,"Ativo","Quantidade","Valor (R$)"]);for(const v of vendas)rows.push([v.data,S.ativos[v.ativoId]?.nome||"",String(v.qtd).replace(".",","),(v.valor/100).toFixed(2).replace(".",",")])}}
  rows.push([]);rows.push(["Movimentos de investimento","Ativo","Tipo","Quantidade","Preço (R$)","Valor (R$)","Nota"]);
  for(const mv of Object.values(S.movs).sort((a,b)=>a.data<b.data?-1:1))rows.push([mv.data,S.ativos[mv.ativoId]?.nome||"",mv.tipo,mv.qtd?String(mv.qtd).replace(".",","):"",mv.preco?(mv.preco/100).toFixed(2).replace(".",","):"",(mv.valor/100).toFixed(2).replace(".",","),mv.nota||""]);
  const csv="\uFEFF"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  try{await dl.save({filename:"financas-casal.csv",data:csv});toast("Planilha exportada")}catch(e){if(e&&e.code!=="declined")toast("Não foi possível exportar")}
}
async function importFile(file){
  if(!file)return;const txt=await file.text();const forma=S.impForma||cardIds()[0];const rows=[];
  if(/<OFX|<STMTTRN/i.test(txt)){const re=/<STMTTRN>([\s\S]*?)<\/STMTTRN>/gi;let m;while((m=re.exec(txt))){const b=m[1];const amt=parseFloat((b.match(/<TRNAMT>([^<\r\n]+)/i)||[])[1]||"0");const dt=(b.match(/<DTPOSTED>(\d{8})/i)||[])[1];const memo=((b.match(/<MEMO>([^<\r\n]+)/i)||b.match(/<NAME>([^<\r\n]+)/i)||[])[1]||"Importado").trim();
      if(amt&&dt)rows.push({desc:memo,valor:Math.round(Math.abs(amt)*100),data:`${dt.slice(0,4)}-${dt.slice(4,6)}-${dt.slice(6,8)}`,credito:amt>0})}}
  else{const lines=txt.split(/\r?\n/).filter(l=>l.trim());const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?";":",";
    for(const l of lines){const c=l.split(sep).map(x=>x.replace(/^"|"$/g,"").trim());if(c.length<3)continue;const dm=c[0].match(/(\d{2})\/(\d{2})\/(\d{4})/)||c[0].match(/(\d{4})-(\d{2})-(\d{2})/);if(!dm)continue;
      const data=c[0].includes("/")?`${dm[3]}-${dm[2]}-${dm[1]}`:c[0].slice(0,10);let v=NaN,desc="";for(let i=1;i<c.length;i++){const pv=parseMoney(c[i]);if(!isNaN(pv)&&/\d/.test(c[i])&&!/[a-z]{3}/i.test(c[i])){v=pv}else if(!desc&&/[a-z]/i.test(c[i]))desc=c[i]}
      if(!isNaN(v)&&v)rows.push({desc:desc||"Importado",valor:Math.abs(v),data,credito:v<0})}}
  const compras=rows.filter(r=>!r.credito);
  if(!compras.length){toast("Nenhuma compra reconhecida no arquivo");return}
  if(!confirm(`Importar ${compras.length} compras como ${formaNome(forma)}?`))return;
  let n=0;for(const r of compras){const it={desc:r.desc.slice(0,60),valor:r.valor,forma,tipo:"avulso",parcelas:1,parcelaAtual:1,mes:firstPayMonth(forma,r.data),cat:"des",quem:defaultQuem(),criado:new Date().toISOString(),importado:true};
    if(await saveItem(newId(),it))n++}
  toast(`${n} compras importadas. Revise as categorias.`);
}

function toastUndo(msg){const t=document.getElementById("toast");t.innerHTML=esc(msg)+' <button id="undo">Desfazer</button>';t.style.display="block";clearTimeout(tt);tt=setTimeout(()=>{t.style.display="none";S.trash=null},7000);

async function migrarSubs(){try{if(localStorage.getItem("fc_mig_subs"))return}catch(e){return}let n=0;
  for(const it of Object.values(S.items)){if((it.cat!=="des"&&it.cat!=="via")||it.sub)continue;const c=catDe(it.desc);if(c.cat!==it.cat||c.sub==="outros")continue;
    const d=Object.assign({},it,{sub:c.sub});delete d.id;if(await saveItem(it.id,d))n++}
  try{localStorage.setItem("fc_mig_subs","1")}catch(e){}if(n)toast(`${n} ${n===1?"lançamento ganhou":"lançamentos ganharam"} subtipo automaticamente`)}
function migrarCom(){let n=0;for(const it of Object.values(S.items))if(it.cat==="com"){it.cat="srv";it.sub="comercial";n++}if(n&&S.mode!=="db")lsSet(LS.items,S.items)}
